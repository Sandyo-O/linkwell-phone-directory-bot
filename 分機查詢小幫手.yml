app:
  description: 凌群電腦內部同仁分機查詢小幫手 - 輸入姓名查分機,並可寄到指定email
  icon: "\U0001F4DE"
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: 分機查詢小幫手
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables:
  - description: 目前流程狀態,await_email 代表正在等待使用者輸入email
    id: 4f6a2b10-1a2b-4c3d-9e10-000000000001
    name: stage
    selector: [conversation, stage]
    value: ''
    value_type: string
  - description: 上一輪查到的同仁姓名
    id: 4f6a2b10-1a2b-4c3d-9e10-000000000002
    name: pending_name
    selector: [conversation, pending_name]
    value: ''
    value_type: string
  - description: 上一輪查到的分機號碼
    id: 4f6a2b10-1a2b-4c3d-9e10-000000000003
    name: pending_ext
    selector: [conversation, pending_ext]
    value: ''
    value_type: string
  - description: 上一輪查到的部門
    id: 4f6a2b10-1a2b-4c3d-9e10-000000000004
    name: pending_dept
    selector: [conversation, pending_dept]
    value: ''
    value_type: string
  - description: 上一輪查到的地區
    id: 4f6a2b10-1a2b-4c3d-9e10-000000000005
    name: pending_loc
    selector: [conversation, pending_loc]
    value: ''
    value_type: string
  environment_variables: []
  features:
    file_upload: {}
    opening_statement: |-
      您好!我是凌群電腦內部同仁分機查詢小幫手。

      請直接輸入想查詢的同仁姓名(例如:王小明),我找到分機後會問您的email,再把分機寄給您。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-if_stage
      source: start
      sourceHandle: source
      target: if_stage
      targetHandle: target
    - id: if_stage-true-validate_email
      source: if_stage
      sourceHandle: 'true'
      target: validate_email
      targetHandle: target
    - id: if_stage-false-lookup
      source: if_stage
      sourceHandle: 'false'
      target: lookup
      targetHandle: target
    - id: validate_email-if_valid_email
      source: validate_email
      sourceHandle: source
      target: if_valid_email
      targetHandle: target
    - id: if_valid_email-true-send_email
      source: if_valid_email
      sourceHandle: 'true'
      target: send_email
      targetHandle: target
    - id: if_valid_email-false-answer_invalid_email
      source: if_valid_email
      sourceHandle: 'false'
      target: answer_invalid_email
      targetHandle: target
    - id: send_email-if_sent
      source: send_email
      sourceHandle: source
      target: if_sent
      targetHandle: target
    - id: if_sent-true-answer_sent
      source: if_sent
      sourceHandle: 'true'
      target: answer_sent
      targetHandle: target
    - id: if_sent-false-answer_send_failed
      source: if_sent
      sourceHandle: 'false'
      target: answer_send_failed
      targetHandle: target
    - id: answer_sent-reset_state
      source: answer_sent
      sourceHandle: source
      target: reset_state
      targetHandle: target
    - id: answer_send_failed-reset_state
      source: answer_send_failed
      sourceHandle: source
      target: reset_state
      targetHandle: target
    - id: lookup-if_found
      source: lookup
      sourceHandle: source
      target: if_found
      targetHandle: target
    - id: if_found-true-set_pending
      source: if_found
      sourceHandle: 'true'
      target: set_pending
      targetHandle: target
    - id: if_found-false-if_multiple
      source: if_found
      sourceHandle: 'false'
      target: if_multiple
      targetHandle: target
    - id: set_pending-answer_found
      source: set_pending
      sourceHandle: source
      target: answer_found
      targetHandle: target
    - id: if_multiple-true-answer_multiple
      source: if_multiple
      sourceHandle: 'true'
      target: if_same_name
      targetHandle: target
    - id: if_multiple-false-answer_not_found
      source: if_multiple
      sourceHandle: 'false'
      target: answer_not_found
      targetHandle: target
    - id: if_same_name-true-answer_multiple_same
      source: if_same_name
      sourceHandle: 'true'
      target: answer_multiple_same
      targetHandle: target
    - id: if_same_name-false-answer_multiple
      source: if_same_name
      sourceHandle: 'false'
      target: answer_multiple
      targetHandle: target
    nodes:
    - id: start
      type: custom
      position: {x: 0, y: 400}
      data: {desc: '', title: Start, type: start, variables: []}
    - id: if_stage
      type: custom
      position: {x: 260, y: 400}
      data:
        desc: 判斷這句話是「查姓名」還是「回覆email」
        title: 判斷目前流程狀態
        type: if-else
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - id: cond-stage-await
            comparison_operator: 'is'
            varType: string
            value: await_email
            variable_selector: [conversation, stage]
    - id: validate_email
      type: custom
      position: {x: 520, y: 300}
      data:
        desc: 檢查使用者輸入的是不是合法email格式
        title: 驗證Email格式
        type: code
        code_language: python3
        code: |-
          import re


          def main(query: str) -> dict:
              email = (query or '').strip()
              pattern = r'^[^@\s]+@[^@\s]+\.[^@\s]+$'
              valid = bool(re.match(pattern, email))
              return {
                  'email': email,
                  'valid': 'true' if valid else 'false',
              }
        variables:
        - variable: query
          value_selector: [sys, query]
        outputs:
          email: {type: string, children: null}
          valid: {type: string, children: null}
    - id: if_valid_email
      type: custom
      position: {x: 780, y: 300}
      data:
        desc: ''
        title: Email格式正確嗎?
        type: if-else
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - id: cond-email-valid
            comparison_operator: 'is'
            varType: string
            value: 'true'
            variable_selector: [validate_email, valid]
    - id: send_email
      type: custom
      position: {x: 1040, y: 200}
      data:
        desc: 用公司內部SMTP寄信(需先在「環境變數」設定 SMTP_HOST/PORT/USER/PASSWORD/FROM/USE_SSL,全部走地端,不經第三方雲端服務)
        title: 寄送Email(內部SMTP)
        type: code
        code_language: python3
        code: |-
          import smtplib
          from email.mime.text import MIMEText
          from email.header import Header


          PLACEHOLDER_VALUES = ('', 'none', '-', 'n/a', 'na', '無', '留空', '(留空)')


          def clean(v):
              v = (v or '').strip()
              if v.lower() in PLACEHOLDER_VALUES:
                  return ''
              return v


          def main(to_email: str, name: str, ext: str, dept: str, loc: str,
                   smtp_host: str, smtp_port: str, smtp_user: str, smtp_password: str,
                   smtp_from: str, smtp_use_ssl: str) -> dict:
              host = clean(smtp_host)
              if not host:
                  return {'sent': 'false', 'error': 'SMTP_HOST 尚未設定,請到 Dify 環境變數設定內部郵件伺服器'}
              try:
                  port = int(clean(smtp_port) or '587')
              except ValueError:
                  port = 587
              smtp_user = clean(smtp_user)
              smtp_password = clean(smtp_password)
              from_addr = clean(smtp_from) or smtp_user
              use_ssl = clean(smtp_use_ssl).lower() == 'true'

              subject = '凌群電腦分機查詢結果'
              body = (
                  f"您好,您查詢的同仁 {name} 分機為:{ext}\n"
                  f"部門:{dept}\n"
                  f"地區:{loc}\n\n"
                  f"(此信由凌群電腦分機查詢小幫手自動寄送)"
              )
              msg = MIMEText(body, 'plain', 'utf-8')
              msg['Subject'] = Header(subject, 'utf-8')
              msg['From'] = from_addr
              msg['To'] = to_email

              try:
                  if use_ssl:
                      server = smtplib.SMTP_SSL(host, port, timeout=15)
                  else:
                      server = smtplib.SMTP(host, port, timeout=15)
                      server.ehlo()
                      if server.has_extn('STARTTLS'):
                          server.starttls()
                          server.ehlo()
                  if smtp_user and smtp_password:
                      server.login(smtp_user, smtp_password)
                  server.sendmail(from_addr, [to_email], msg.as_string())
                  server.quit()
                  return {'sent': 'true', 'error': ''}
              except Exception as e:
                  return {'sent': 'false', 'error': str(e)}
        variables:
        - variable: to_email
          value_selector: [validate_email, email]
        - variable: name
          value_selector: [conversation, pending_name]
        - variable: ext
          value_selector: [conversation, pending_ext]
        - variable: dept
          value_selector: [conversation, pending_dept]
        - variable: loc
          value_selector: [conversation, pending_loc]
        - variable: smtp_host
          value_selector: [env, SMTP_HOST]
        - variable: smtp_port
          value_selector: [env, SMTP_PORT]
        - variable: smtp_user
          value_selector: [env, SMTP_USER]
        - variable: smtp_password
          value_selector: [env, SMTP_PASSWORD]
        - variable: smtp_from
          value_selector: [env, SMTP_FROM]
        - variable: smtp_use_ssl
          value_selector: [env, SMTP_USE_SSL]
        outputs:
          sent: {type: string, children: null}
          error: {type: string, children: null}
    - id: if_sent
      type: custom
      position: {x: 1300, y: 200}
      data:
        desc: ''
        title: 有寄成功嗎?
        type: if-else
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - id: cond-sent-true
            comparison_operator: 'is'
            varType: string
            value: 'true'
            variable_selector: [send_email, sent]
    - id: answer_sent
      type: custom
      position: {x: 1560, y: 140}
      data:
        desc: ''
        title: 回覆已寄送
        type: answer
        variables: []
        answer: |-
          好的,已經把「{{#conversation.pending_name#}}」的分機({{#conversation.pending_ext#}})寄到 {{#validate_email.email#}} 囉!

          還想查其他同仁的分機嗎?直接輸入姓名即可。
    - id: answer_send_failed
      type: custom
      position: {x: 1560, y: 260}
      data:
        desc: ''
        title: 回覆寄送失敗
        type: answer
        variables: []
        answer: |-
          抱歉,信件寄送失敗了(系統訊息:{{#send_email.error#}})。

          這通常是內部郵件伺服器設定或網路連線的問題,請聯絡IT協助檢查,不是你操作有誤。

          還想再查其他同仁的分機嗎?直接輸入姓名即可。
    - id: reset_state
      type: custom
      position: {x: 1560, y: 200}
      data:
        desc: 清空暫存狀態,回到可查詢下一位同仁
        title: 重設狀態
        type: assigner
        version: '2'
        items:
        - variable_selector: [conversation, stage]
          input_type: constant
          operation: over-write
          write_mode: over-write
          value: ''
        - variable_selector: [conversation, pending_name]
          input_type: constant
          operation: over-write
          write_mode: over-write
          value: ''
        - variable_selector: [conversation, pending_ext]
          input_type: constant
          operation: over-write
          write_mode: over-write
          value: ''
        - variable_selector: [conversation, pending_dept]
          input_type: constant
          operation: over-write
          write_mode: over-write
          value: ''
        - variable_selector: [conversation, pending_loc]
          input_type: constant
          operation: over-write
          write_mode: over-write
          value: ''
    - id: answer_invalid_email
      type: custom
      position: {x: 1040, y: 460}
      data:
        desc: ''
        title: 回覆Email格式錯誤
        type: answer
        variables: []
        answer: 這個看起來不是有效的email格式,請重新輸入你的email地址(例如:name@example.com)。
    - id: lookup
      type: custom
      position: {x: 520, y: 560}
      data:
        desc: 從凌群電腦9個地區的分機資料庫中比對姓名
        title: 查詢分機資料庫
        type: code
        code_language: python3
        code: |-
          import re

